<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Store Daily Khata</title>
    
    <meta name="theme-color" content="#0b57d0">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="data:,">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- jsPDF Library for PDF Download -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- OneSignal Web SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "16cdacd4-3e90-49ff-8d12-fa652c07e49c",
        });
      });
    </script>
</head>
<body>

    <!-- Developer Banner -->
    <div class="dev-banner">
        <span>Developed with <span class="heart">❤️</span> by <strong>ARSALAN KHAN</strong></span>
    </div>

    <div class="container">
        <header class="app-header">
            <h1>Cold Store Khata</h1>
            <p>Bahrain Market Daily Bookkeeping</p>
        </header>

        <main>
            <!-- Authentication Section (Login / Sign Up) -->
            <section id="auth-section">
                <div class="auth-tabs">
                    <button id="show-login-btn" class="tab-btn active">Login</button>
                    <button id="show-signup-btn" class="tab-btn">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" class="auth-form">
                    <h2>Welcome Back</h2>
                    <div class="input-group">
                        <label for="login-email">Email Address</label>
                        <input type="email" id="login-email" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="login-password">Password</label>
                        <input type="password" id="login-password" placeholder="Enter your password" required>
                    </div>
                    <button type="submit" id="login-btn" class="samsung-btn">Login</button>
                </form>

                <!-- Sign Up Form -->
                <form id="signup-form" class="auth-form" style="display: none;">
                    <h2>Create Account</h2>
                    <div class="input-group">
                        <label for="signup-email">Email Address</label>
                        <input type="email" id="signup-email" placeholder="name@example.com" required>
                    </div>
                    <div class="input-group">
                        <label for="signup-password">Password</label>
                        <input type="password" id="signup-password" placeholder="Create a secure password" required>
                    </div>
                    <button type="submit" id="signup-btn" class="samsung-btn">Sign Up</button>
                </form>
            </section>

            <!-- Dashboard / Khata Section -->
            <section id="app-dashboard" style="display: none;">
                <div class="user-info-bar">
                    <span id="user-email-display"></span>
                    <div style="display: flex; gap: 8px; align-items: center;">
                        <button id="install-btn" class="install-btn" style="display: none;">📲 Install</button>
                        <button id="logout-btn" class="logout-btn">Logout</button>
                    </div>
                </div>

                <!-- Total Amount Summary Card -->
                <div class="total-summary-card">
                    <div>
                        <span class="summary-label">Total Khata Amount</span>
                        <h2 id="total-amount-display">0.000 BHD</h2>
                    </div>
                    <div class="summary-icon">💰</div>
                </div>

                <!-- Entry Form Section (Supports Add & Edit) -->
                <div id="entry-form-section" class="samsung-card">
                    <h2 id="form-title">Add New Entry</h2>
                    <form id="entry-form">
                        <input type="hidden" id="edit-entry-id">
                        <div class="input-group">
                            <label for="customer-name">Customer Name</label>
                            <input type="text" id="customer-name" placeholder="Enter customer name" required>
                        </div>
                        <div class="input-group">
                            <label for="item-desc">Item Description</label>
                            <input type="text" id="item-desc" placeholder="Item name / details" required>
                        </div>
                        <div class="input-group">
                            <label for="amount">Amount (BHD)</label>
                            <input type="number" id="amount" placeholder="0.000" step="0.001" required>
                        </div>
                        <div style="display: flex; gap: 10px;">
                            <button type="submit" id="add-btn" class="samsung-btn" style="flex: 2;">Save Entry</button>
                            <button type="button" id="cancel-edit-btn" class="delete-btn" style="flex: 1; display: none;">Cancel</button>
                        </div>
                    </form>
                </div>

                <!-- Records & Transactions Section -->
                <div id="records-section" class="samsung-card" style="margin-top: 20px;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
                        <h2 style="margin: 0;">Transactions</h2>
                        <button id="download-pdf-btn" class="pdf-btn">📥 Download PDF</button>
                    </div>
                    <div class="filter-container">
                        <input type="text" id="search-box" placeholder="Search by name...">
                    </div>
                    <div class="table-container">
                        <table id="khata-table">
                            <thead>
                                <tr>
                                    <th>Date</th>
                                    <th>Name</th>
                                    <th>Description</th>
                                    <th>Amount</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="table-body">
                                <!-- Data rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Main JavaScript File -->
    <script type="module" src="app.js"></script>
</body>
</html>
