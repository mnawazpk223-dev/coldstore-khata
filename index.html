<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Store Daily Khata</title>
    
    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="data:,">
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- OneSignal Web SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "16cdacd4-3e90-49ff-8d12-fa652c07e49c",
        });
      });
    </script>
</head>
<body>

    <div class="container">
        <header>
            <h1>Cold Store Daily Khata</h1>
            <p>Bahrain Market Daily Bookkeeping</p>
        </header>

        <main>
            <!-- Original Entry Form Section -->
            <section id="entry-form-section">
                <h2>Add New Entry</h2>
                <form id="entry-form">
                    <div class="input-group">
                        <label for="customer-name">Customer Name</label>
                        <input type="text" id="customer-name" placeholder="Enter customer name" required>
                    </div>
                    <div class="input-group">
                        <label for="item-desc">Item Description</label>
                        <input type="text" id="item-desc" placeholder="Item name / details" required>
                    </div>
                    <div class="input-group">
                        <label for="amount">Amount (BHD)</label>
                        <input type="number" id="amount" placeholder="0.000" step="0.001" required>
                    </div>
                    <button type="submit" id="add-btn">Add Entry</button>
                </form>
            </section>

            <!-- Original Records & Transactions Section -->
            <section id="records-section">
                <h2>Transactions & Balances</h2>
                <div class="filter-container">
                    <input type="text" id="search-box" placeholder="Search by name...">
                </div>
                <div class="table-container">
                    <table id="khata-table">
                        <thead>
                            <tr>
                                <th>Date</th>
                                <th>Name</th>
                                <th>Description</th>
                                <th>Amount</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="table-body">
                            <!-- JavaScript data rows will load here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <!-- Main JavaScript File -->
    <script type="module" src="app.js"></script>

    <!-- OneSignal Prompt Script -->
    <script>
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
            try {
                await OneSignal.Slidedown.promptPush();
            } catch (error) {
                console.log("Notification prompt already handled.");
            }
        });
    </script>
</body>
</html>
