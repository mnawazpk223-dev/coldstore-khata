<html lang="en">
<head>

    <meta name="theme-color" content="#2563eb">
    <link rel="icon" href="data:,"> <!-- 404 Favicon error bachne ke liye -->
    
    <!-- CSS Stylesheet -->
    <link rel="stylesheet" href="styles.css">

    <!-- OneSignal Web SDK -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      window.OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "16cdacd4-3e90-49ff-8d12-fa652c07e49c",
          notifyButton: {
            enable: true,
          },
        });
      });

</head>
<body>

        <header>
            <h1>Cold Store Daily Khata</h1>

    <!-- Main JavaScript File with Module Type -->
    <script type="module" src="app.js"></script>
    
    <script>
        // OneSignal Automatic Prompt Trigger
        window.OneSignalDeferred = window.OneSignalDeferred || [];
        window.OneSignalDeferred.push(async function(OneSignal) {
            try {
                await OneSignal.Slidedown.promptPush();
            } catch (error) {
                console.log("Notification prompt handled or already granted.");
            }
        });
    </script>
