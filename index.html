<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cold Store Khata</title>
    
    <!-- PWA & Mobile Settings -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1e3c72">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Cold Store Khata">
    
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="data:,">
    
    <!-- PDF Libraries -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.28/jspdf.plugin.autotable.min.js"></script>
</head>
<body>

    <!-- RUNNING BANNER (TOP) -->
    <div style="background: #1e3c72; color: #ffffff; padding: 8px 0; font-weight: bold; font-size: 14px; border-bottom: 2px solid #ffc107; text-align: center;">
        <marquee behavior="scroll" direction="left" scrollamount="6">
            ✨ Made by ARSALAN KHAN ✨
        </marquee>
    </div>

    <!-- PWA Install / Download App Button (Always Visible on Top) -->
    <div id="installContainer" style="max-width: 450px; margin: 15px auto; padding: 0 15px;">
        <button id="installAppBtn" style="background: #2ec4b6; color: #fff; width: 100%; font-weight: bold; padding: 12px; border: none; border-radius: 6px; cursor: pointer; font-size: 15px; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">📲 Download & Install App</button>
    </div>

    <!-- AUTH SECTION (Login / Sign Up) -->
    <div id="authContainer" class="auth-box">
        <h2 id="authTitle">Login to Khata</h2>
        <form id="authForm">
            <input type="email" id="authEmail" placeholder="Email Address" required>
            <input type="password" id="authPassword" placeholder="Password (Min 6 characters)" required>
            <button type="submit" id="authBtn">Sign In</button>
        </form>
        <p id="toggleAuth" style="text-align: center; margin-top: 15px; font-size: 14px;">
            Don't have an account? <a href="#" id="switchAuth">Sign Up</a>
        </p>
    </div>

    <!-- MAIN APP SECTION -->
    <div id="appContainer" class="app-container" style="display: none;">
        <div class="header-bar" style="margin-top: 15px;">
            <h2>❄️ Cold Store Daily Khata</h2>
            <button id="logoutBtn">Logout</button>
        </div>
        <p id="clock"></p>

        <!-- Undo Notification Bar -->
        <div id="undoToast" class="toast" style="display: none;">
            <span>Entry has been deleted.</span>
            <button id="undoBtn">↩️ Undo Delete</button>
        </div>

        <!-- Entry Form -->
        <div class="card">
            <h3 id="formTitle">Add New Entry</h3>
            <form id="khataForm">
                <input type="hidden" id="editId">
                <input type="text" id="itemName" placeholder="Item Name (e.g. Ice Cream Box)" required>
                <input type="text" id="desc" placeholder="Description / Customer Name" required>
                <div class="row">
                    <input type="number" id="price" step="0.001" placeholder="Total Price (Blank = 0)">
                    <input type="number" id="paid" step="0.001" placeholder="Amount Paid (Blank = 0)">
                </div>
                <button type="submit" id="saveBtn">➕ Save & Sync Entry</button>
                <button type="button" id="cancelEditBtn" style="display:none; background:#6c757d; margin-top:5px;">Cancel Edit</button>
            </form>
        </div>

        <!-- Total Balance Sheet -->
        <div class="card summary">
            <div>Total: <b id="totalPrice">BD 0.000</b></div>
            <div>Paid: <b id="totalPaid" style="color:#2ec4b6;">BD 0.000</b></div>
            <div>Balance: <b id="totalBalance" style="color:#ff9f1c;">BD 0.000</b></div>
        </div>

        <div class="action-buttons">
            <button id="pdfBtn">📄 Download PDF</button>
            <button id="resetAllBtn">⚠️ Reset All Khata</button>
        </div>

        <!-- Table -->
        <div class="card">
            <h3>Today's Khata Log</h3>
            <div style="overflow-x: auto;">
                <table border="1" width="100%">
                    <thead>
                        <tr>
                            <th>Date/Time</th>
                            <th>Item</th>
                            <th>Details</th>
                            <th>Price</th>
                            <th>Paid</th>
                            <th>Balance</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Main JavaScript File -->
    <script type="module" src="app.js"></script>
</body>
</html>
